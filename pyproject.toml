[project]
name = "redliner"
version = "0.1.0"
description = "CrewAI + Google ADK B2B contract review and redlining system"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.3.0",
    "crewai>=1.15.41",
    "fastapi>=0.115",
    "google-adk>=2.14.1",
    "httpx>=0.27",
    "langfuse>=5.2.0",
    "lxml>=5.0",
    "mcp>=1.30.0",
    "openai>=2.54.0",
    "pillow>=10.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
